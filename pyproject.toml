[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "antiddi"
version = "3.0.0"
description = "Evidence-state framework, benchmark resource, and degree-controlled evaluation tools for drug non-interaction research"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Adeeb Noor", email = "arnoor@kau.edu.sa" },
]
maintainers = [
  { name = "Adeeb Noor", email = "arnoor@kau.edu.sa" },
]
keywords = [
  "Anti-DDI",
  "drug-drug interactions",
  "drug non-interaction",
  "clinical decision support",
  "pharmacovigilance",
  "benchmarking",
  "RIDI",
  "FAERS",
  "degree bias",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Healthcare Industry",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "pandas>=1.5",
  "numpy>=1.23",
  "scipy>=1.9",
]

[project.urls]
Homepage = "https://github.com/adeebnoor/ANTI-DDI"
Repository = "https://github.com/adeebnoor/ANTI-DDI"

[tool.setuptools]
packages = ["antiddi"]

[tool.setuptools.package-data]
antiddi = ["py.typed"]
