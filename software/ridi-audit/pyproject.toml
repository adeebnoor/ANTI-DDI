[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ridi-audit"
version = "0.1.0"
description = "Decision-identity reproducibility audit under representation interventions"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Adeeb Noor"}]
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10"]

[project.scripts]
ridi-audit = "ridi_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
