name: probe-bindingdb-temporal

on:
  push:
    branches: [science-structural-shortcuts]
    paths:
      - .github/workflows/probe_bindingdb_temporal.yml
      - bindingdb_probe.trigger
  workflow_dispatch:

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: science-structural-shortcuts}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Download curated-article BindingDB TSV
        run: |
          mkdir -p external_data
          curl -fL --retry 4 --retry-delay 2 \
            'https://www.bindingdb.org/rwd/bind/chemsearch/marvin/SDFdownload.jsp?download_file=%2Frwd%2Fbind%2Fdownloads%2FBindingDB_BindingDB_Articles_202609_tsv.zip' \
            -o external_data/bindingdb_articles.zip
          ls -lh external_data/bindingdb_articles.zip
          sha256sum external_data/bindingdb_articles.zip
          unzip -l external_data/bindingdb_articles.zip | head -20
          unzip -q external_data/bindingdb_articles.zip -d external_data/bindingdb_articles
      - name: Inspect schema and temporal fields
        run: |
          python - <<'PY'
          import glob, pandas as pd, os
          fs=glob.glob('external_data/bindingdb_articles/*')
          print('FILES',[(os.path.basename(f),os.path.getsize(f)) for f in fs])
          f=max(fs,key=os.path.getsize)
          d=pd.read_csv(f,sep='\t',nrows=5,low_memory=False)
          print('COLUMNS',list(d.columns))
          print('DATE_COLUMNS',[c for c in d.columns if 'date' in c.lower() or 'year' in c.lower() or 'pub' in c.lower()])
          print(d[[c for c in d.columns if 'date' in c.lower() or 'year' in c.lower() or 'pub' in c.lower()][:12]].head().to_string())
          PY
