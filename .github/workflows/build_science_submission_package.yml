name: build-science-submission-package

on:
  workflow_dispatch:
  push:
    branches:
      - science-structural-shortcuts
    paths:
      - 'manuscript/SCIENCE_MANUSCRIPT_v0.7_PRE_SUBMISSION.md'
      - 'submission/SCIENCE_SUPPLEMENTARY_MATERIALS.md'
      - 'submission/SCIENCE_COVER_LETTER.md'
      - 'figures/source_data_main.csv'
      - 'analysis/build_science_figures.py'
      - '.github/workflows/build_science_submission_package.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frozen Science branch
        uses: actions/checkout@v4
        with:
          ref: science-structural-shortcuts
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas matplotlib
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Build four main figures from source data
        run: |
          python analysis/build_science_figures.py

      - name: Build DOCX submission files
        run: |
          mkdir -p submission/generated
          pandoc --from=gfm --resource-path=manuscript:figures/generated:. \
            manuscript/SCIENCE_MANUSCRIPT_v0.7_PRE_SUBMISSION.md \
            -o submission/generated/Science_Research_Article_PRE_SUBMISSION.docx
          pandoc --from=gfm \
            submission/SCIENCE_SUPPLEMENTARY_MATERIALS.md \
            -o submission/generated/Science_Supplementary_Materials_PRE_SUBMISSION.docx
          pandoc --from=gfm \
            submission/SCIENCE_COVER_LETTER.md \
            -o submission/generated/Science_Cover_Letter.docx

      - name: Verify generated package
        run: |
          test -s submission/generated/Science_Research_Article_PRE_SUBMISSION.docx
          test -s submission/generated/Science_Supplementary_Materials_PRE_SUBMISSION.docx
          test -s submission/generated/Science_Cover_Letter.docx
          test -s figures/generated/Figure1_structural_observability.png
          test -s figures/generated/Figure2_hypothesis_identity.png
          test -s figures/generated/Figure3_biogrid_future_evidence.png
          test -s figures/generated/Figure4_chembl_frontier.png
          ls -lh submission/generated figures/generated

      - name: Publish downloadable pre-submission package
        uses: actions/upload-artifact@v4
        with:
          name: Science-pre-submission-package
          if-no-files-found: error
          retention-days: 30
          path: |
            submission/generated/*.docx
            submission/SCIENCE_CTS_METADATA.md
            submission/RELATED_WORK_DISCLOSURE.md
            submission/FILE_MANIFEST.md
            figures/generated/*.png
            figures/generated/*.pdf
            figures/source_data_main.csv

      - name: Commit generated submission package
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add submission/generated figures/generated
          if git diff --cached --quiet; then
            echo 'Generated package unchanged.'
          else
            git commit -m 'Build Science pre-submission DOCX and main figures'
            git push origin HEAD:science-structural-shortcuts
          fi
