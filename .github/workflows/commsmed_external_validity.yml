name: commsmed external validity replication

# Confirmatory external results were frozen from protocol-lock commit
# add54b8ce2c312d5245e7f00af27623306e449c4 in run 32529326608.
# Automatic reruns are disabled after outcome inspection; manual rerun remains
# available for reproducibility checks.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-replication:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: study/commsmed-external-validity
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install locked dependencies
        working-directory: study/negative_set_validity
        run: python -m pip install -r requirements.txt
      - name: Validate protocol lock and no held-out-label training
        working-directory: study/negative_set_validity
        run: python validate_design_lock.py
      - name: Download public external inputs and record hashes
        working-directory: study/negative_set_validity
        run: python download_external_data.py
      - name: Validate external schemas and pair-level aggregation
        working-directory: study/negative_set_validity
        run: python summarize_external_inputs.py
      - name: Run external replication — 20 seeds
        working-directory: study/negative_set_validity
        env:
          SEEDS: '20'
          DDI_OUT_DIR: 'results_external'
        run: bash run_external.sh
      - name: Create result checksums
        working-directory: study/negative_set_validity
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('results_external')
          hashes={f.name:hashlib.sha256(f.read_bytes()).hexdigest() for f in sorted(p.glob('*')) if f.is_file()}
          Path('results_external/CHECKSUMS.json').write_text(json.dumps(hashes,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: commsmed-external-validity-results
          path: |
            study/negative_set_validity/results_external/
            study/negative_set_validity/external_source_manifest.json
            study/negative_set_validity/external_input_summary.json
          if-no-files-found: error
          retention-days: 90
