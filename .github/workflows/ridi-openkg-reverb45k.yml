name: RIDI OpenKG ReVerb45K locked replication

on:
  push:
    branches: [ridi-ncs-openkg]
    paths:
      - 'experiments/ridi_ncs/**'
      - '.github/workflows/ridi-openkg-reverb45k.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reverb45k:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout frozen experiment branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn

      - name: Download official CESI ReVerb45K files
        run: |
          mkdir -p experiments/ridi_ncs/data
          curl -L --fail --retry 5 --retry-delay 3 \
            https://raw.githubusercontent.com/malllabiisc/cesi/master/data/reverb45k/reverb45k_valid \
            -o experiments/ridi_ncs/data/reverb45k_valid
          curl -L --fail --retry 5 --retry-delay 3 \
            https://raw.githubusercontent.com/malllabiisc/cesi/master/data/reverb45k/reverb45k_test \
            -o experiments/ridi_ncs/data/reverb45k_test
          sha256sum experiments/ridi_ncs/data/reverb45k_valid experiments/ridi_ncs/data/reverb45k_test | tee experiments/ridi_ncs/input_sha256.txt
          wc -c experiments/ridi_ncs/data/reverb45k_valid experiments/ridi_ncs/data/reverb45k_test

      - name: Execute prospectively locked RIDI analysis
        run: |
          mkdir -p experiments/ridi_ncs/results
          python experiments/ridi_ncs/34_openkg_reverb45k_ridi.py \
            --valid experiments/ridi_ncs/data/reverb45k_valid \
            --test experiments/ridi_ncs/data/reverb45k_test \
            --out experiments/ridi_ncs/results \
            | tee experiments/ridi_ncs/results/run_stdout.json

      - name: Verify exact negative control
        run: |
          python - <<'PY'
          import json
          p='experiments/ridi_ncs/results/gate_summary.json'
          x=json.load(open(p))
          print(json.dumps(x,indent=2))
          if not x['negative_control_exact_zero']:
              raise SystemExit('Negative control failed: do not interpret OpenKG outcomes.')
          PY

      - name: Build provenance bundle
        if: always()
        run: |
          git rev-parse HEAD > experiments/ridi_ncs/results/experiment_commit.txt
          cp experiments/ridi_ncs/OPENKG_IMPLEMENTATION_ADDENDUM_20260821.md experiments/ridi_ncs/results/
          cp experiments/ridi_ncs/input_sha256.txt experiments/ridi_ncs/results/ || true
          sha256sum experiments/ridi_ncs/34_openkg_reverb45k_ridi.py > experiments/ridi_ncs/results/code_sha256.txt

      - name: Upload immutable result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RIDI_ReVerb45K_${{ github.sha }}
          path: experiments/ridi_ncs/results/
          if-no-files-found: error
          retention-days: 90
