name: RIDI Nature cross-modal locked experiments

on:
  push:
    branches: [ridi-nature-attribution-v1]
    paths:
      - 'experiments/ridi_nature/**'
      - '.github/workflows/ridi_nature_crossmodal.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/ridi_nature/**'
      - '.github/workflows/ridi_nature_crossmodal.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'

jobs:
  tabular:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install numpy pandas scipy scikit-learn
      - name: Run locked E-TABULAR
        env:
          OUTDIR: results/tabular
        run: python experiments/ridi_nature/code/run_tabular.py
      - uses: actions/upload-artifact@v4
        with:
          name: ridi-e-tabular
          path: results/tabular
          if-no-files-found: error

  text:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install numpy pandas scipy scikit-learn
      - name: Run locked E-TEXT
        env:
          OUTDIR: results/text
        run: python experiments/ridi_nature/code/run_text.py
      - uses: actions/upload-artifact@v4
        with:
          name: ridi-e-text
          path: results/text
          if-no-files-found: error

  certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install numpy pandas scipy
      - name: Run locked E-CERTIFICATE
        env:
          OUTDIR: results/certificate
        run: python experiments/ridi_nature/code/run_certificate.py
      - uses: actions/upload-artifact@v4
        with:
          name: ridi-e-certificate
          path: results/certificate
          if-no-files-found: error

  vision:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numeric dependencies
        run: python -m pip install --upgrade pip && pip install numpy pandas scipy scikit-learn
      - name: Install CPU PyTorch
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Run locked E-VISION
        env:
          OUTDIR: results/vision
        run: python experiments/ridi_nature/code/run_vision.py
      - uses: actions/upload-artifact@v4
        with:
          name: ridi-e-vision
          path: results/vision
          if-no-files-found: error
