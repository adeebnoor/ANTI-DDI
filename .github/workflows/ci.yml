name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Re-derive v2 published quantities
        run: python validate.py --verbose

      - name: Rebuild v3 release tables
        run: |
          python build_v3.py
          python semantic_harden_v3.py

      - name: Validate v3 semantic and release invariants
        run: python validate_v3.py

      - name: Validate corrective ATC5 structural-bias outputs
        run: python analysis/validate_degree_bias_outputs.py

      - name: Ensure superseded experiment is marked withdrawn
        run: |
          grep -q "withdrawn" VALIDATION_NOTICE_20260820.md
          grep -q "not valid as evidence" paper5/PAPER5_RIDI_VALIDATION.md
