name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Re-derive v2 published quantities
        run: python validate.py --verbose

      - name: Rebuild v3 release tables
        run: python build_v3.py

      - name: Validate v3 semantic and release invariants
        run: python validate_v3.py

      - name: Reproduce corrective ATC5 structural-bias diagnostic
        run: |
          python analysis/run_degree_bias_atc5.py \
            --positives data/goldd2_atc5_positive_reference.csv.gz \
            --antiddi data/antiddi_v2_dataset.csv \
            --out /tmp/degree_bias.csv \
            --summary /tmp/degree_bias.json
          python - <<'PY'
          import json, pandas as pd
          expected=pd.read_csv('data/degree_bias_atc5_replicates.csv')
          observed=pd.read_csv('/tmp/degree_bias.csv')
          pd.testing.assert_frame_equal(expected, observed, check_exact=False, rtol=1e-12, atol=1e-12)
          e=json.load(open('data/degree_bias_atc5_summary.json'))
          o=json.load(open('/tmp/degree_bias.json'))
          for k in ['positive_atc5_pairs','positive_atc5_nodes','curated_atc5_pairs_before_overlap_exclusion','class_pair_overlap_excluded','curated_atc5_pairs_analyzed','replicates','n_matched_range']:
              assert e[k] == o[k], (k,e[k],o[k])
          for k in ['auc_random_mean','auc_random_sd','auc_curated_mean','auc_curated_sd','auc_degree_matched_mean','auc_degree_matched_sd','curated_minus_matched_mean','n_matched_mean']:
              assert abs(e[k]-o[k]) < 1e-12, (k,e[k],o[k])
          print('ATC5 structural-bias reproduction PASS')
          PY
