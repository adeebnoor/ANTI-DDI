name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Re-derive v2 published quantities
        run: python validate.py --verbose

      - name: Rebuild v3 release tables
        run: python build_v3.py

      - name: Validate v3 semantic and release invariants
        run: python validate_v3.py
