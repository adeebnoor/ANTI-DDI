name: commsmed posthoc CRESCENDDI structural matching

on:
  workflow_dispatch:
  push:
    branches:
      - study/commsmed-external-validity
    paths:
      - 'study/negative_set_validity/POSTHOC_PLAN_CRESCENDDI_CURATED_MATCHING.md'
      - 'study/negative_set_validity/posthoc_crescenddi_matching.py'
      - '.github/workflows/commsmed_posthoc_crescenddi.yml'

permissions:
  contents: read

jobs:
  posthoc-mechanism:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: study/commsmed-external-validity
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        working-directory: study/negative_set_validity
        run: python -m pip install -r requirements.txt
      - name: Download and checksum same external inputs
        working-directory: study/negative_set_validity
        run: python download_external_data.py
      - name: Run explicitly post-hoc curated-negative structural matching
        working-directory: study/negative_set_validity
        run: python posthoc_crescenddi_matching.py | tee results_posthoc_crescenddi/POSTHOC_LOG.txt
      - name: Create checksums
        working-directory: study/negative_set_validity
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('results_posthoc_crescenddi')
          hashes={f.name:hashlib.sha256(f.read_bytes()).hexdigest() for f in sorted(p.glob('*')) if f.is_file()}
          (p/'CHECKSUMS.json').write_text(json.dumps(hashes,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: commsmed-posthoc-crescenddi
          path: |
            study/negative_set_validity/results_posthoc_crescenddi/
            study/negative_set_validity/external_source_manifest.json
          if-no-files-found: error
          retention-days: 90
